<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    h1 { margin: 0 0 4px; color: #1e1b4b; }
    .subtitle { margin: 0 0 20px; color: #6b7280; font-size: 0.95rem; }

    .add-row { display: flex; gap: 8px; }

    .add-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .add-row input:focus { outline: 2px solid #4f46e5; border-color: transparent; }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    #add-btn { padding: 0 18px; background: #4f46e5; color: #fff; }
    #add-btn:hover { background: #4338ca; }

    .error { min-height: 1.2em; margin: 8px 0 0; color: #dc2626; font-size: 0.9rem; }

    .filters { display: flex; gap: 8px; margin: 12px 0; }

    .filters button {
      flex: 1;
      padding: 8px;
      background: #eef2ff;
      color: #4f46e5;
    }

    .filters button.active { background: #4f46e5; color: #fff; }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #e5e7eb;
    }

    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

    li span { flex: 1; color: #1f2937; word-break: break-word; }
    li.done span { color: #9ca3af; text-decoration: line-through; }

    .delete-btn { background: transparent; color: #dc2626; font-size: 1.2rem; padding: 0 6px; }
    .delete-btn:hover { background: #fee2e2; }

    .empty { text-align: center; color: #9ca3af; padding: 20px 0; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      color: #6b7280;
      font-size: 0.9rem;
    }

    #clear-btn { background: transparent; color: #4f46e5; }
    #clear-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Todo List</h1>
    <p class="subtitle">Add your tasks and tick them off.</p>

    <form id="todo-form" class="add-row" novalidate>
      <input type="text" id="todo-input" placeholder="What do you need to do?" maxlength="120" autocomplete="off" />
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty" class="empty hidden-empty">No tasks yet. Add one above!</p>

    <div class="footer">
      <span id="count">0 tasks left</span>
      <button type="button" id="clear-btn">Clear completed</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "todo-list-tasks";

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const errorEl = document.getElementById("error");
    const listEl = document.getElementById("todo-list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const clearBtn = document.getElementById("clear-btn");
    const filterButtons = document.querySelectorAll("#filters button");

    let todos = loadTodos();
    let currentFilter = "all";

    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (e) {
        return [];
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        // storage may be blocked; app still works for this session
      }
    }

    function addTodo(text) {
      todos.push({ id: Date.now() + Math.random(), text: text, done: false });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map(function (t) {
        return t.id === id ? { id: t.id, text: t.text, done: !t.done } : t;
      });
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(function (t) { return t.id !== id; });
      saveTodos();
      render();
    }

    function visibleTodos() {
      if (currentFilter === "active") return todos.filter(function (t) { return !t.done; });
      if (currentFilter === "completed") return todos.filter(function (t) { return t.done; });
      return todos;
    }

    function render() {
      listEl.innerHTML = "";
      const items = visibleTodos();

      items.forEach(function (todo) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", function () { toggleTodo(todo.id); });

        const span = document.createElement("span");
        span.textContent = todo.text; // textContent keeps user input safe

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete-btn";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete task");
        del.addEventListener("click", function () { deleteTodo(todo.id); });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });

      emptyEl.style.display = items.length === 0 ? "block" : "none";

      const left = todos.filter(function (t) { return !t.done; }).length;
      countEl.textContent = left + (left === 1 ? " task left" : " tasks left");
      clearBtn.style.display = todos.some(function (t) { return t.done; }) ? "inline" : "none";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        errorEl.textContent = "Please type a task first.";
        return;
      }
      errorEl.textContent = "";
      addTodo(text);
      input.value = "";
      input.focus();
    });

    filterButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach(function (b) { b.classList.toggle("active", b === btn); });
        render();
      });
    });

    clearBtn.addEventListener("click", function () {
      todos = todos.filter(function (t) { return !t.done; });
      saveTodos();
      render();
    });

    render();
  </script>
</body>
</html>
